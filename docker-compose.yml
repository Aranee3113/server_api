version: '3.8'

services:
  mysql:
    image: mysql:5.7
    container_name: maikamear
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: maikamear-db
      MYSQL_USER: maikamear
      MYSQL_PASSWORD: 123456
    ports:
      - "3388:3306"
    volumes:
      - mysql_maikamear:/var/lib/mysql

volumes:
  mysql_maikamear:

